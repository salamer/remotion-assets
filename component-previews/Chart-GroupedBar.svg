<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="GroupedBarChart 框图动画示意">
<title>GroupedBarChart / 代码绘制的动画示意</title><desc>类别框出现 → 同组双柱长高 → 图例补齐</desc>
<style>
svg .a{animation:fm-enter 4.8s ease both infinite;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:center}
svg .gx{animation:fm-x 4.8s cubic-bezier(.2,.8,.2,1) both infinite;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:left center}
svg .gy{animation:fm-y 4.8s cubic-bezier(.2,.8,.2,1) both infinite;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:center bottom}
svg .dr{stroke-dasharray:1;animation:fm-draw 4.8s ease both infinite;animation-delay:var(--d,0s)}
svg .pan{animation:fm-pan 4.8s linear infinite}
svg .zoom{animation:fm-zoom 4.8s ease both infinite;transform-box:fill-box;transform-origin:center}
svg .flip{animation:fm-flip 4.8s ease both infinite;transform-box:fill-box;transform-origin:center}
svg .n0{animation:fm-n0 4.8s linear infinite}svg .n1{animation:fm-n1 4.8s linear infinite}svg .n2{animation:fm-n2 4.8s linear infinite}
svg .theme>rect{animation:fm-theme 4.8s steps(1,end) infinite}
svg .seek{animation:fm-seek 4.8s linear infinite;transform-box:fill-box;transform-origin:left}
@keyframes fm-enter{0%,3%{opacity:0;transform:translateY(9px)}22%,89%{opacity:1;transform:translateY(0)}99%,100%{opacity:0;transform:translateY(0)}}
@keyframes fm-x{0%,5%{transform:scaleX(0);opacity:0}27%,89%{transform:scaleX(1);opacity:1}99%,100%{transform:scaleX(1);opacity:0}}
@keyframes fm-y{0%,5%{transform:scaleY(0);opacity:0}27%,89%{transform:scaleY(1);opacity:1}99%,100%{transform:scaleY(1);opacity:0}}
@keyframes fm-draw{0%,8%{stroke-dashoffset:1;opacity:0}12%{opacity:1}48%,89%{stroke-dashoffset:0;opacity:1}99%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes fm-pan{from{transform:translateX(0)}to{transform:translateX(-480px)}}
@keyframes fm-zoom{0%,15%{transform:scale(.9);opacity:0}30%{opacity:1;transform:scale(1)}65%,89%{opacity:1;transform:scale(1.14)}100%{opacity:0;transform:scale(1.14)}}
@keyframes fm-flip{0%,4%{transform:scaleX(.02);opacity:0}23%,47%{transform:scaleX(1);opacity:1}57%{transform:scaleX(.02);opacity:1}73%,89%{transform:scaleX(1);opacity:1}100%{opacity:0}}
@keyframes fm-n0{0%,13%{opacity:1}14%,100%{opacity:0}}@keyframes fm-n1{0%,13%{opacity:0}14%,28%{opacity:1}29%,100%{opacity:0}}@keyframes fm-n2{0%,28%{opacity:0}29%,90%{opacity:1}99%,100%{opacity:0}}
@keyframes fm-theme{0%,32%{fill:#fff8cf}33%,65%{fill:#e5f2fa}66%,100%{fill:#e9f1df}}
@keyframes fm-seek{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){svg *{animation:none!important;stroke-dashoffset:0!important}svg .n0,svg .n1{display:none}}
</style><rect width="720" height="360" fill="#fafaf7"/>
<g font-family="IBM Plex Mono, ui-monospace, monospace"><rect x="18" y="18" width="684" height="324" fill="none" stroke="#171917" stroke-width="1.8"/>
<text x="36" y="47" font-size="17" fill="#171917" text-anchor="start" class="" style="--d:0s">GroupedBarChart</text><text x="681" y="47" font-size="10" fill="#74796e" text-anchor="end" class="" style="--d:0s">SCHEMATIC</text>
<path d="M18 61 H702" stroke="#171917"/><path d="M70 85 L70 275" fill="none" stroke="#171917" stroke-width="2" pathLength="1" class="dr" style="--d:0s" stroke-linejoin="round" stroke-linecap="round"/><path d="M70 275 L658 275" fill="none" stroke="#171917" stroke-width="2" pathLength="1" class="dr" style="--d:0s" stroke-linejoin="round" stroke-linecap="round"/><path d="M70 125 L658 125" fill="none" stroke="#dce0d6" stroke-width="1" pathLength="1" class="dr" style="--d:0s" stroke-linejoin="round" stroke-linecap="round"/><path d="M70 175 L658 175" fill="none" stroke="#dce0d6" stroke-width="1" pathLength="1" class="dr" style="--d:0s" stroke-linejoin="round" stroke-linecap="round"/><path d="M70 225 L658 225" fill="none" stroke="#dce0d6" stroke-width="1" pathLength="1" class="dr" style="--d:0s" stroke-linejoin="round" stroke-linecap="round"/><g class="gy" style="--d:0.0s"><rect x="94.0" y="193" width="36.5" height="82" rx="2" fill="#ffd43b" stroke="#171917" stroke-width="1.6"/></g><g class="gy" style="--d:0.15s"><rect x="133.5" y="215.96" width="36.5" height="59.04" rx="2" fill="#bfc8b4" stroke="#171917" stroke-width="1.6"/></g><text x="133.5" y="295" font-size="13" fill="#171917" text-anchor="middle" class="a" style="--d:0.5s">A</text><g class="gy" style="--d:0.1s"><rect x="204.0" y="143" width="36.5" height="132" rx="2" fill="#ffd43b" stroke="#171917" stroke-width="1.6"/></g><g class="gy" style="--d:0.25s"><rect x="243.5" y="179.96" width="36.5" height="95.03999999999999" rx="2" fill="#bfc8b4" stroke="#171917" stroke-width="1.6"/></g><text x="243.5" y="295" font-size="13" fill="#171917" text-anchor="middle" class="a" style="--d:0.5s">B</text><g class="gy" style="--d:0.2s"><rect x="314.0" y="173" width="36.5" height="102" rx="2" fill="#ffd43b" stroke="#171917" stroke-width="1.6"/></g><g class="gy" style="--d:0.35s"><rect x="353.5" y="201.56" width="36.5" height="73.44" rx="2" fill="#bfc8b4" stroke="#171917" stroke-width="1.6"/></g><text x="353.5" y="295" font-size="13" fill="#171917" text-anchor="middle" class="a" style="--d:0.5s">C</text><g class="gy" style="--d:0.30000000000000004s"><rect x="424.0" y="102" width="36.5" height="173" rx="2" fill="#ffd43b" stroke="#171917" stroke-width="1.6"/></g><g class="gy" style="--d:0.45000000000000007s"><rect x="463.5" y="150.44" width="36.5" height="124.56" rx="2" fill="#bfc8b4" stroke="#171917" stroke-width="1.6"/></g><text x="463.5" y="295" font-size="13" fill="#171917" text-anchor="middle" class="a" style="--d:0.5s">D</text><g class="gy" style="--d:0.4s"><rect x="534.0" y="130" width="36.5" height="145" rx="2" fill="#ffd43b" stroke="#171917" stroke-width="1.6"/></g><g class="gy" style="--d:0.55s"><rect x="573.5" y="170.60000000000002" width="36.5" height="104.39999999999999" rx="2" fill="#bfc8b4" stroke="#171917" stroke-width="1.6"/></g><text x="573.5" y="295" font-size="13" fill="#171917" text-anchor="middle" class="a" style="--d:0.5s">E</text>
<text x="36" y="327" font-size="11" fill="#74796e" text-anchor="start" class="" style="--d:0s">01  FRAME    →    02  MOTION    →    03  HOLD</text>
<rect x="533" y="316" width="145" height="4" fill="#dce1d4"/><rect x="533" y="316" width="145" height="4" fill="#171917" class="seek"/>
</g></svg>